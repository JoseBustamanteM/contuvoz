<app-aviso-modo-practica />

<div class="pinta">
  <letter-tracer class="pinta__pizarra" [letter]="currentLetter" (resultadoListo)="onResultadoListo($event)">
    <!-- Va en la esquina de la pizarra: puntaje del último intento o estado del guardado. -->
    @if (ultimoResultado(); as r) {
      <p class="nota" [class.nota--ok]="r.aprobadoPintado">
        {{ r.aprobadoPintado ? '⭐' : '💪' }} {{ r.puntajeFinal | number: '1.0-0' }}%
      </p>
    } @else if (estadoGuardado() === 'guardando') {
      <p class="nota nota--suave">Guardando…</p>
    } @else if (estadoGuardado() === 'error') {
      <div class="nota nota--error">
        <span>No se guardó</span>
        <button type="button" class="btn-reintentar" (click)="reintentarManualmente()">Reintentar</button>
      </div>
    }
  </letter-tracer>

  <letter-selector class="pinta__carrete" [letra]="currentLetter" (letterSelected)="onLetraCambiada($event)" />
</div>
