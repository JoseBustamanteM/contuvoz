<div class="h-[100dvh] font-sans text-center px-4 py-3 flex flex-col overflow-hidden">

  <div class="header-bar">
    <app-logout-button />
    @if (usuario(); as u) {
      @if ([1,2,3].includes(u.idRol)) {
        <a routerLink="/gestion-usuarios" class="btn-gestion">👥 Usuarios</a>
      }
    }
  </div>

  @if (usuario(); as u) {
    <p>Hola, {{ u.primerNombre }} {{ u.aPaterno }} ({{ u.rol.nomRol }})</p>
  }

  <h1 class="text-2xl sm:text-4xl font-bold text-white mb-2 shrink-0">
    ¡Elige una actividad!
  </h1>

  <div class="flex-1 min-h-0 w-full flex justify-center overflow-hidden">
    <option-component class="w-full max-w-xl" />
  </div>
</div>
