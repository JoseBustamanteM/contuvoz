<app-back-button />
<app-aviso-modo-practica />

<div class="talk-page">

  <app-mascot-header
    [practiceState]="practiceState()"
    [selectedVocal]="selectedVocal()"
  />

  <section class="talk-page__selector-section" aria-label="Selecciona una vocal">
    <h2 class="talk-page__section-label">¿Qué vocal quieres practicar?</h2>
    <app-vocal-selector
      [selectedVocal]="selectedVocal()"
      [practiceState]="practiceState()"
      (vocalSelected)="onVocalSelected($event)"
    />
  </section>

  <section class="talk-page__action-section" aria-label="Iniciar práctica">
    <app-practice-button
      [selectedVocal]="selectedVocal()"
      [practiceState]="practiceState()"
      [duracionMs]="duracionEscuchaMs"
      [escuchando]="microfonoAbierto()"
      (practiceStart)="onPracticeStart()"
    />

    @if (practiceState() === 'listening') {
      <div class="talk-page__wave" aria-hidden="true">
        <app-waveform-visualizer />
      </div>
    }
  </section>

  @if (errorMicrofono()) {
    <section class="talk-page__aviso talk-page__aviso--error" role="alert">
      <span class="talk-page__aviso-icono" aria-hidden="true">🎙️🚫</span>
      <p>{{ errorMicrofono() }}</p>
    </section>
  }

  @if (practiceState() === 'success' || practiceState() === 'failure') {
    <section class="talk-page__feedback-section" aria-live="polite" aria-label="Resultado">
      <app-result-feedback
        [practiceState]="practiceState()"
        [selectedVocal]="selectedVocal()"
        [detectedVocal]="detectedVocal()"
      />
    </section>
  }

  @if (errorGuardado()) {
    <section class="talk-page__aviso" role="status">
      <p>No pudimos guardar este intento.</p>
      <button type="button" class="talk-page__btn-reintentar" [disabled]="guardando()"
              (click)="reintentarGuardado()">
        {{ guardando() ? 'Guardando…' : 'Reintentar' }}
      </button>
    </section>
  }

</div>
