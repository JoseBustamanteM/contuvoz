<app-aviso-modo-practica />

<div class="hablemos">
  <h1 class="sr-only">Hablemos</h1>

  <app-vocal-selector
    class="hablemos__globos"
    [selectedVocal]="selectedVocal()"
    [practiceState]="practiceState()"
    (vocalSelected)="onVocalSelected($event)"
  />

  <app-mascot-header
    class="hablemos__guia"
    [practiceState]="practiceState()"
    [selectedVocal]="selectedVocal()"
    [detectedVocal]="detectedVocal()"
    [motivo]="motivoRepetir()"
    [errorMicrofono]="errorMicrofono()"
  />

  <section class="hablemos__mic" aria-label="Micrófono">
    <app-practice-button
      [selectedVocal]="selectedVocal()"
      [practiceState]="practiceState()"
      [escuchando]="microfonoAbierto()"
      [oyendoVoz]="oyendoVoz()"
      [progreso]="progresoEscucha()"
      (practiceStart)="onPracticeStart()"
    />

    <!-- Alto fijo, haya o no algo: así el micrófono no salta de lugar. -->
    <div class="hablemos__bajo-mic">
      @if (practiceState() === 'listening') {
        <app-waveform-visualizer class="hablemos__onda" aria-hidden="true" />
      } @else if (errorGuardado()) {
        <p class="aviso-guardado" role="status">
          No pudimos guardar este intento.
          <button type="button" [disabled]="guardando()" (click)="reintentarGuardado()">
            {{ guardando() ? 'Guardando…' : 'Reintentar' }}
          </button>
        </p>
      }
    </div>
  </section>
</div>
