<div class="login-container">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-card">
    <h1>Iniciar sesión</h1>


    <label for="rut">RUT</label>
    <input
      id="rut"
      type="text"
      formControlName="rutUsuario"
      placeholder="11111111-1"
      autocomplete="username"
    />
    @if (form.controls.rutUsuario.touched && form.controls.rutUsuario.invalid) {
      <small class="error">El RUT es obligatorio</small>
    }

    <label for="password">Contraseña</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
    />
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <small class="error">La contraseña es obligatoria</small>
    }

    @if (error()) {
      <p class="error-box">{{ error() }}</p>
    }

    <button type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
    </button>
  </form>
</div>
