<div class="carrete" role="group" aria-label="Elegir letra">
  <button type="button" class="carrete__flecha" (click)="cambiar(-1)"
          [attr.aria-label]="'Letra anterior: ' + anterior()">
    <span aria-hidden="true">▲</span>
  </button>
  <span class="carrete__vecina" aria-hidden="true">{{ anterior().toLowerCase() }}</span>
  <span class="carrete__actual" aria-live="polite" [attr.aria-label]="'Letra ' + actual()">
    {{ actual().toLowerCase() }}
  </span>
  <span class="carrete__vecina" aria-hidden="true">{{ siguiente().toLowerCase() }}</span>
  <button type="button" class="carrete__flecha" (click)="cambiar(1)"
          [attr.aria-label]="'Letra siguiente: ' + siguiente()">
    <span aria-hidden="true">▼</span>
  </button>
</div>
