@if (usuario(); as u) {
  <header class="barra">
    <!-- Izquierda: marca + volver al inicio -->
    <div class="barra__lado">
      <a routerLink="/" class="marca" aria-label="ConTuVoz, ir al inicio">
        <img src="images/gecko-cara.webp" alt="" class="marca__gecko" />
        <span class="marca__texto">Con<span>Tu</span>Voz</span>
      </a>

      @if (!enInicio()) {
        <a routerLink="/" class="boton boton--inicio" aria-label="Volver al inicio">
          <svg class="boton__icono" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2.6 11.3 12 3.2l9.4 8.1a1 1 0 0 1-.65 1.76H20V20a1.5 1.5 0 0 1-1.5 1.5H15V15H9v6.5H5.5A1.5 1.5 0 0 1 4 20v-6.94h-.75a1 1 0 0 1-.65-1.76z"/>
          </svg>
          <span class="boton__texto">Inicio</span>
        </a>
      }
    </div>

    <!-- Derecha: secciones, perfil y salir -->
    <nav class="barra__lado" aria-label="Menú principal">
      @if (esEstudiante()) {
        <a routerLink="/mis-logros" routerLinkActive="boton--activo" class="boton" title="Mis logros">
          <svg class="boton__icono" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2.2c.5 0 .95.28 1.17.73l2.3 4.7 5.2.75a1.3 1.3 0 0 1 .72 2.22l-3.76 3.65.9 5.16a1.3 1.3 0 0 1-1.9 1.37L12 18.35l-4.63 2.43a1.3 1.3 0 0 1-1.9-1.37l.9-5.16L2.6 10.6a1.3 1.3 0 0 1 .72-2.22l5.2-.75 2.3-4.7c.22-.45.68-.73 1.18-.73z"/>
          </svg>
          <span class="boton__texto">Mis logros</span>
        </a>
      }

      <button type="button" class="boton" (click)="pronto('La biblioteca')" title="Biblioteca (muy pronto)">
        <svg class="boton__icono" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 5.5A2.5 2.5 0 0 1 5.5 3H10a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H5.500A2.5 2.5 0 0 1 3 18.5zM13 4a1 1 0 0 1 1-1h4.5A2.5 2.5 0 0 1 21 5.5v13a2.5 2.5 0 0 1-2.5 2.5H14a1 1 0 0 1-1-1z"/>
        </svg>
        <span class="boton__texto">Biblioteca</span>
      </button>

      @if (puedeGestionar()) {
        <a routerLink="/gestion-usuarios" routerLinkActive="boton--activo" class="boton" title="Gestión de usuarios">
          <svg class="boton__icono" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 11.2a3.7 3.7 0 1 0 0-7.4 3.7 3.7 0 0 0 0 7.4zm0 1.8c-3.5 0-6.5 1.9-6.5 4.700V19A1.5 1.5 0 0 0 4 20.5h10a1.5 1.5 0 0 0 1.5-1.5v-1.3C15.5 14.9 12.5 13 9 13zm8-2.3a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm.3 1.8c-.5 0-.98.05-1.43.16 1.03 1.05 1.63 2.4 1.63 4.040v1.3c0 .53-.1 1.03-.28 1.5H20.5A1.5 1.5 0 0 0 22 19v-1.5c0-2.9-2.1-5-4.7-5z"/>
          </svg>
          <span class="boton__texto">Usuarios</span>
        </a>
      }

      <!-- Perfil: la ficha del usuario. Hoy solo avisa que viene pronto. -->
      <button type="button" class="perfil" (click)="pronto('Tu perfil')"
              [title]="u.primerNombre + ' ' + u.aPaterno + ' · ' + nombreRol() + ' (perfil muy pronto)'">
        <span class="perfil__avatar" aria-hidden="true">{{ iniciales() }}</span>
        <span class="perfil__datos">
          <span class="perfil__nombre">{{ u.primerNombre }}</span>
          <span class="perfil__rol">{{ nombreRol() }}</span>
        </span>
      </button>

      <app-logout-button />
    </nav>
  </header>

  @if (avisoPronto(); as aviso) {
    <div class="pronto" role="status">
      <img src="images/gecko-cara.webp" alt="" class="pronto__gecko" />
      {{ aviso }}
    </div>
  }
}
