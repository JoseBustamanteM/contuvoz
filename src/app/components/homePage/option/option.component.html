<!-- Grilla 2x2 de actividades: tarjetas de papel con marco de madera. El alto
     lo define aspect-ratio en cada tarjeta, que las mantiene cuadradas. -->
<div class="tarjetas">
  @for (image of images; track image.id) {
    <a [routerLink]="image.url" class="tarjeta">
      <!-- min-height: 0 en el contenedor: sin esto la imagen no se deja encoger
           y desborda la tarjeta en pantallas bajas. -->
      <span class="tarjeta__dibujo">
        <img [src]="image.img" [alt]="image.alt" />
      </span>
      <span class="tarjeta__nombre">
        <span aria-hidden="true">{{ image.icon }}</span> {{ image.name }}
      </span>
    </a>
  }
</div>
