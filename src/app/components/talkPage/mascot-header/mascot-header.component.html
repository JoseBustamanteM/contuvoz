<div class="guia">
  <div class="burbuja" [class]="'burbuja--' + tono()" role="status" aria-live="polite">
    <p class="burbuja__titulo">{{ mensaje().titulo }}</p>
    @if (mensaje().detalle; as detalle) {
      <p class="burbuja__detalle">{{ detalle }}</p>
    }
  </div>
  <img class="guia__gecko" src="images/gecko-habla.webp" alt="" />
</div>
