<div class="mic-zona" [class]="'mic-zona--' + practiceState()">
  <div class="mic-anillo"
       [class.mic-anillo--contando]="escuchando()"
       [style.--progreso]="progreso()"
       role="progressbar"
       aria-label="Tiempo restante de escucha"
       aria-valuemin="0" aria-valuemax="100"
       [attr.aria-valuenow]="escuchando() ? progresoPorcentaje() : null">
    <button
      type="button"
      class="mic"
      [class.mic--oyendo]="oyendoVoz()"
      [disabled]="isDisabled()"
      [attr.aria-label]="ariaLabel()"
      (click)="onButtonClick()"
    >
      <span aria-hidden="true">🎤</span>
    </button>
  </div>

  <span class="mic-etiqueta" aria-hidden="true">{{ etiqueta() }}</span>
</div>
