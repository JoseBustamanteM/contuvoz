<div class="globos" role="group" aria-label="Vocales para practicar">
  @for (vocal of vocals; track vocal.letter) {
    <button
      type="button"
      class="globo"
      [class.globo--elegido]="isSelected(vocal.letter)"
      [disabled]="isDisabled()"
      [attr.aria-pressed]="isSelected(vocal.letter)"
      [attr.aria-label]="'Vocal ' + vocal.letter + ', de ' + vocal.word"
      (click)="selectVocal(vocal.letter)"
    >
      <span class="globo__cuerpo">{{ vocal.letter }}</span>
      <span class="globo__hilo" aria-hidden="true"></span>
    </button>
  }
</div>
