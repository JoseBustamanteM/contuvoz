<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Contuvoz</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Playwrite+CU:wght@100..400&display=swap" rel="stylesheet">
</head>
<body style="background-image: url('images/fondo.jpg')">
  <app-root>
    <!-- Skeleton de arranque: se ve mientras Angular restaura la sesión con el
         servidor (provideAppInitializer) y desaparece solo cuando la app se
         dibuja. Tiene la forma de la barra superior y del inicio, que es lo
         que ve la mayoría al abrir. Usa .sk de styles.css. -->
    <div aria-hidden="true" style="height: 100dvh; display: flex; flex-direction: column; overflow: hidden;">
      <div style="position: relative; padding: 30px 16px 8px;">
        <span style="position: absolute; left: 0; right: 20px; top: 12px; height: 10px; border-radius: 0 999px 999px 0; background: rgba(90,122,0,0.7);"></span>
        <div style="max-width: 72rem; margin: 0 auto; display: flex; align-items: center; gap: 10px;">
          <span class="sk" style="width: 56px; height: 44px; border-radius: 6px 24px 6px 24px;"></span>
          <span style="flex: 1;"></span>
          <span class="sk" style="width: 56px; height: 44px; border-radius: 6px 24px 6px 24px;"></span>
          <span class="sk" style="width: 56px; height: 44px; border-radius: 6px 24px 6px 24px;"></span>
          <span class="sk" style="width: 56px; height: 44px; border-radius: 6px 24px 6px 24px;"></span>
        </div>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 4px 16px;">
        <span class="sk sk--pildora" style="width: min(20rem, 80%); height: 52px;"></span>
        <div style="width: min(36rem, 100%, calc(100dvh - 12.5rem)); display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <span class="sk" style="aspect-ratio: 1; border-radius: 24px;"></span>
          <span class="sk" style="aspect-ratio: 1; border-radius: 24px;"></span>
          <span class="sk" style="aspect-ratio: 1; border-radius: 24px;"></span>
          <span class="sk" style="aspect-ratio: 1; border-radius: 24px;"></span>
        </div>
      </div>
    </div>
  </app-root>
</body>
</html>
