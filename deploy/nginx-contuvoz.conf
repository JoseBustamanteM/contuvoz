# Nginx para ContuVoz en la VPS.
# Copiar a /etc/nginx/sites-available/contuvoz y activar (ver DEPLOY.md).
#
#   /       → frontend compilado (Angular)
#   /api/   → backend NestJS en 127.0.0.1:4000
#
# El túnel de Cloudflare apunta a este servidor (http://localhost:80) y le pone
# el HTTPS que necesitan la cámara y el micrófono.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/contuvoz/dist/contuvoz/browser;
    index index.html;

    # El modelo de manos de MediaPipe pesa ~8 MB; los wasm ~11 MB.
    client_max_body_size 5m;
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # Backend. Sin barra final en proxy_pass: se conserva /api/... tal cual,
    # que es el prefijo global de NestJS (main.ts).
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Archivos con hash en el nombre (main-XXXX.js, styles-XXXX.css): se pueden
    # guardar en caché mucho tiempo, cambian de nombre en cada compilación.
    location ~* "-[A-Z0-9]{8}\.(js|css)$" {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.wasm$ {
        types { application/wasm wasm; }
        expires 7d;
        try_files $uri =404;
    }

    # Rutas de Angular (/login, /mis-logros…): siempre index.html, y sin
    # caché para que una actualización se vea de inmediato.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
