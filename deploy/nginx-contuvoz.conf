# Nginx para ContuVoz en la VPS.
# Copiar a /etc/nginx/sites-available/contuvoz y activar (ver DEPLOY.md).
#
#   /       → frontend compilado (Angular)
#   /api/   → backend NestJS en 127.0.0.1:4000
#
# El túnel de Cloudflare apunta a este servidor (http://localhost:80) y le pone
# el HTTPS que necesitan la cámara y el micrófono.

# Límite de peticiones al login, por visitante. Con el túnel todas las
# conexiones llegan desde 127.0.0.1, así que la IP real se toma de la cabecera
# CF-Connecting-IP que pone Cloudflare (y de la conexión si no viene).
# Es un primer filtro grueso: el límite fino por RUT y por IP lo aplica el
# backend (auth.service.ts). Holgado porque un colegio entero comparte IP.
map $http_cf_connecting_ip $visitante_login {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $visitante_login zone=contuvoz_login:10m rate=30r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/contuvoz/dist/contuvoz/browser;
    index index.html;

    # El modelo de manos de MediaPipe pesa ~8 MB; los wasm ~11 MB.
    client_max_body_size 5m;
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # Login: igual que /api/ pero con límite (30 por minuto, hasta 40 seguidos
    # sin esperar: alcanza para que un curso entero entre a la vez).
    location = /api/auth/login {
        limit_req zone=contuvoz_login burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Backend. Sin barra final en proxy_pass: se conserva /api/... tal cual,
    # que es el prefijo global de NestJS (main.ts).
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Archivos con hash en el nombre (main-XXXX.js, styles-XXXX.css): se pueden
    # guardar en caché mucho tiempo, cambian de nombre en cada compilación.
    location ~* "-[A-Z0-9]{8}\.(js|css)$" {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # MediaPipe (Comunícate): modelo de manos (~8 MB) y wasm (~11 MB). Cambian
    # solo al actualizar la librería, así que el navegador los guarda 30 días y
    # la precarga tras el login no vuelve a bajarlos en cada visita.
    location ^~ /mediapipe/ {
        types {
            application/wasm wasm;
            application/javascript js;
            application/octet-stream task;
        }
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Imágenes y fuentes: 7 días. Si se reemplaza una con el mismo nombre, se
    # verá la nueva a más tardar en una semana (o recargando sin caché).
    location ~* \.(webp|png|jpg|jpeg|svg|ico|woff2|woff)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Rutas de Angular (/login, /mis-logros…): siempre index.html, y sin
    # caché para que una actualización se vea de inmediato.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
