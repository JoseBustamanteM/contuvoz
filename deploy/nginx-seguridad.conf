# Cabeceras de seguridad de ContuVoz.
# Copiar a /etc/nginx/snippets/contuvoz-seguridad.conf (ver DEPLOY.md).
#
# Se incluye en el server y en CADA location que tenga su propio add_header:
# en Nginx, un add_header dentro de un location anula todos los heredados, así
# que sin repetir el include esas respuestas saldrían sin estas cabeceras.
#
# Content-Security-Policy: de dónde puede cargar cosas la página.
#   - Todo desde el mismo sitio ('self'): no hay CDN ni Google Fonts.
#   - 'wasm-unsafe-eval': MediaPipe (Comunícate) compila WebAssembly.
#   - style-src 'unsafe-inline': Angular pone estilos en atributos style.
#   - blob: en imágenes y workers: MediaPipe y la cámara los usan.
#   - frame-ancestors 'none': nadie puede meter la app en un iframe.
# Si algo deja de funcionar tras un cambio, la consola del navegador dice qué
# bloqueó la política.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# El navegador no "adivina" el tipo de un archivo distinto al declarado.
add_header X-Content-Type-Options "nosniff" always;

# Respaldo de frame-ancestors para navegadores antiguos.
add_header X-Frame-Options "DENY" always;

# Al seguir un enlace a otro sitio, solo se envía el dominio, no la ruta.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Cámara y micrófono solo para la propia app; lo demás, apagado.
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
